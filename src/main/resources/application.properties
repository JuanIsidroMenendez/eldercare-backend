spring.application.name=eldercare

# Core
spring.profiles.active=mysql

#base end-points config
api-endpoint = api/v1

# Docker
spring.docker.compose.enabled=true

# Clave secreta para firmar y verificar los JWT (HS512 exige 64 caracteres como mínimo)
jwt.key=${JWT_KEY:eldercare-secret-key-for-signing-jwt-tokens-hs512-minimum-64-characters}

# SQL
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true