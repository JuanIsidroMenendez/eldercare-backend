services:
  mysql:
    image: 'mysql:8.4'                              # CAMBIADO: fijo la versión (LTS); 'latest' puede saltar a una major con sorpresas
    environment:                                    # CAMBIADO: valores → variables; los reales viven en .env (no se commitean)
      - 'MYSQL_DATABASE=${MYSQL_DATABASE}'
      - 'MYSQL_USER=${MYSQL_USER}'
      - 'MYSQL_PASSWORD=${MYSQL_PASSWORD}'
      - 'MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}'
    ports:
      - '${MYSQL_PORT:-3306}:3306'                   # CAMBIADO: puerto de host parametrizable (3306 por defecto)
    volumes:                                         # AÑADIDO: persiste los datos entre reinicios
      - 'mysql-data:/var/lib/mysql'

volumes:                                            # AÑADIDO: declaración del volumen
  mysql-data: